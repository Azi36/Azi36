name: 发布

# Pages 的部署来源是「GitHub Actions」而不是分支：main 只放手写的源码，
# 日报产物在 daily-data 分支，这里把两边合起来发出去。
# 这么绕一道是为了让 main 的历史只留人写的提交——日报每天一条，很快就把它淹了。
#
# 体检是发布闸门：不过就不上线，线上维持上一版。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'          # 只改文档不必重新发布
  workflow_call:         # 日报生成完之后调这里发布
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只发一次，但不取消排队中的——后一次发布要带上前一次的产物
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 只有 zone id 放这层：下面那步的 if 看不见 step 自己的 env，得从 job 级取
    env:
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # daily-data 是孤立分支，里面只有 ai/ 和 crypto/ 两个目录
      - name: 取回日报产物
        uses: actions/checkout@v7
        with:
          ref: daily-data
          path: daily
      - name: 去掉日报目录里的 .git
        run: rm -rf daily/.git

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: 体检（发布闸门）
        run: node tools/check.mjs

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v5

      # Cloudflare 那边给 HTML 设了很长的 Edge TTL，就得靠发布来推缓存，
      # 否则新版要等 TTL 到期才露面。两个 Secret 没配就整步跳过，不算失败。
      - name: 刷 Cloudflare 缓存
        if: env.CF_ZONE_ID != ''
        env:
          CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
        run: |
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache"             -H "Authorization: Bearer $CF_PURGE_TOKEN"             -H 'Content-Type: application/json'             --data '{"purge_everything":true}' -o cf.json
          grep -q '"success":true' cf.json || { echo '清缓存失败：'; cat cf.json; exit 1; }
          echo '缓存已清'
