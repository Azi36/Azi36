name: 全站体检

# 手写 14 个 HTML 难免漏改一页，合进 main 之前先让脚本过一遍。
# push 到 main 的那次体检由 deploy.yml 跑（它是发布闸门，不过就不上线），
# 这里只管 PR，省得同一个检查跑两遍。
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: 一致性体检
        run: node tools/check.mjs
