  <!-- 抓幽灵小游戏逻辑 -->
  <script>
    (function () {
      var zone = document.getElementById('ghostZone');
      var ghost = document.getElementById('ghost');
      var scoreEl = document.getElementById('ghostScore');
      if (!zone || !ghost) return;

      var score = 0, TARGET = 5, done = false;

      // 随机传送到区域内的新位置
      function teleport() {
        ghost.style.left = (6 + Math.random() * 80) + '%';
        ghost.style.top = (8 + Math.random() * 66) + '%';
      }

      // 鼠标靠近时有 60% 概率逃跑
      ghost.addEventListener('mouseenter', function () {
        if (!done && Math.random() < 0.6) teleport();
      });

      ghost.addEventListener('click', function (e) {
        if (done) { // 通关后再点：继续撒花
          if (window.aziConfetti) window.aziConfetti(e.clientX, e.clientY);
          return;
        }
        score++;
        if (window.aziConfetti) window.aziConfetti(e.clientX, e.clientY);
        if (score >= TARGET) {
          done = true;
          ghost.textContent = '🎉';
          if (window.twemoji) twemoji.parse(ghost, { folder: 'svg', ext: '.svg' });
          ghost.style.left = '45%';
          ghost.style.top = '35%';
          scoreEl.textContent = '全抓住了！奖励你一个彩蛋：其实哪个页面都比这里好玩';
        } else {
          scoreEl.textContent = '手速不错！继续（' + score + '/' + TARGET + '）';
          teleport();
        }
      });
    })();
  </script>
